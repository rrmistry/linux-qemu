name: Build Debian 13 XFCE live USB ISO

# Manual only: gh workflow run debian-live-usb.yaml
# ISO (~2.2 GB) is over the 2 GiB release-asset limit, so it ships as a workflow artifact:
#   gh run download -n debian-13-xfce-live-amd64-iso
# Write to USB (macOS): sudo /bin/dd if=debian-13-xfce-live-amd64.iso of=/dev/rdiskN bs=4m status=progress
# Optional repo variable LIVE_SSH_AUTHORIZED_KEYS -> ~/.ssh/authorized_keys of the live user.
on:
  workflow_dispatch:

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build ISO with live-build (debian:trixie container)
        env:
          AUTHORIZED_KEYS: ${{ vars.LIVE_SSH_AUTHORIZED_KEYS }}
        run: |
          docker run --rm --privileged -v $PWD:/w -w /w -e AUTHORIZED_KEYS \
            debian:trixie bash src/os/debian/build-live-iso.sh
          sudo mv live/*.iso debian-13-xfce-live-amd64.iso
          sha256sum debian-13-xfce-live-amd64.iso | tee debian-13-xfce-live-amd64.iso.sha256

      - name: Boot test (UEFI Secure Boot + KVM)
        run: |
          sudo apt-get install -y qemu-system-x86 ovmf socat netpbm
          # Secure Boot ON with Microsoft keys, like a store laptop: proves the default (Debian signed) entry boots.
          # SMBIOS says Surface, so surface-mok queues the linux-surface key; after reboot shim must open MokManager.
          cp /usr/share/OVMF/OVMF_VARS_4M.ms.fd vars.fd
          sudo qemu-system-x86_64 -enable-kvm -cpu host -m 4096 -smp 4 \
            -machine q35,smm=on -global driver=cfi.pflash01,property=secure,value=on \
            -drive if=pflash,format=raw,unit=0,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.secboot.fd \
            -drive if=pflash,format=raw,unit=1,file=vars.fd \
            -smbios type=1,manufacturer='Microsoft Corporation',product='Surface Book 3' \
            -cdrom debian-13-xfce-live-amd64.iso -vga std -display none \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -serial file:boot.log -monitor unix:mon.sock,server,nowait &
          shot() { echo "screendump $PWD/screen.ppm" | sudo socat - UNIX-CONNECT:mon.sock; sleep 3; sudo pnmtopng screen.ppm > screen-live.png; }
          timeout 15m bash -c 'until sudo grep -q GRAPHICAL-OK boot.log 2>/dev/null; do sleep 5; done' \
            || { shot; sudo tail -50 boot.log; exit 1; }
          sudo grep -a -i 'secure boot' boot.log || true
          sudo grep -aqi 'secure boot enabled' boot.log || { echo 'Secure Boot was not enabled'; exit 1; }
          sleep 45
          shot
          sudo grep -aq MOK-QUEUED boot.log || { echo 'linux-surface key was not queued'; exit 1; }
          echo system_reset | sudo socat - UNIX-CONNECT:mon.sock; sleep 25
          echo "screendump $PWD/mok.ppm" | sudo socat - UNIX-CONNECT:mon.sock; sleep 3; sudo pnmtopng mok.ppm > screen-mokmanager.png
          echo quit | sudo socat - UNIX-CONNECT:mon.sock || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-boot
          path: |
            boot.log
            screen-live.png
            screen-mokmanager.png
            live/*.packages
            debian-13-xfce-live-amd64.iso.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: debian-13-xfce-live-amd64-iso
          path: debian-13-xfce-live-amd64.iso
          compression-level: 0
          retention-days: 7
